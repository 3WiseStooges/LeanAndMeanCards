[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "LJIndustries"
name = "LeanAndMeanCards"
versionNumber = "1.1.4"
description = "Fourteen cards: knockback, stuns, delayed blasts, and a few that mess with someone else's pick."
websiteUrl = "https://github.com/3WiseStooges/LeanAndMeanCards"
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack_ROUNDS" = "5.4.1900"
"willis81808-UnboundLib" = "3.2.14"
"Pykess-ModdingUtils" = "0.4.8"
"Pykess-CardChoiceSpawnUniqueCardPatch" = "0.1.10"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./package/LeanAndMeanCards.dll"
target = "LeanAndMeanCards.dll"

[[build.copy]]
source = "./package/Art"
target = "Art"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["rounds"]

[publish.categories]
rounds = ["custom-cards", "gameplay"]
