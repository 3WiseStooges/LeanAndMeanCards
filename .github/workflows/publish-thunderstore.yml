name: Publish to Thunderstore

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The mod cannot be built on a runner: it references the ROUNDS managed assemblies
      # and other BepInEx plugins, none of which exist here. The committed DLL is what
      # ships, so make a missing or stale one a loud failure rather than a broken package.
      - name: Verify package contents
        run: |
          test -f package/LeanAndMeanCards.dll || {
            echo "Missing package/LeanAndMeanCards.dll"
            echo "Build locally, then commit the rebuilt package/ directory:"
            echo "  dotnet build LeanAndMeanCards/LeanAndMeanCards.csproj -c Release"
            exit 1
          }
          test -d package/Art && [ "$(ls -A package/Art)" ] || {
            echo "Missing or empty package/Art (thunderstore.toml copies it into the package)"
            exit 1
          }
          echo "package/Art: $(ls package/Art | wc -l) files"


      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import re, os, pathlib
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          path = pathlib.Path("thunderstore.toml")
          text = path.read_text()
          text, n = re.subn(r'(?m)^versionNumber = ".*"$', f'versionNumber = "{version}"', text, count=1)
          if n != 1:
              raise SystemExit("Failed to update versionNumber in thunderstore.toml")
          path.write_text(text)
          print(f"Publishing version {version}")
          PY

      - name: Ensure unique Thunderstore version
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import json, pathlib, re, urllib.error, urllib.request

          def parse(v):
              parts = [int(x) for x in v.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          def inc(v):
              a, b, c = parse(v)
              return f"{a}.{b}.{c + 1}"

          latest = None
          url = "https://thunderstore.io/api/experimental/package/LJIndustries/LeanAndMeanCards/"
          headers = {
              "User-Agent": "LeanAndMeanCards-CI/1.0 (+https://github.com/3WiseStooges/LeanAndMeanCards)",
              "Accept": "application/json",
          }
          last_error = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)
                  latest = data.get("latest", {}).get("version_number") or "0.0.0"
                  break
              except urllib.error.HTTPError as ex:
                  if ex.code == 404:
                      # Package has never been published. Expected on the first run.
                      print("Package not yet on Thunderstore; publishing the committed version.")
                      latest = "0.0.0"
                      break
                  last_error = ex
                  print(f"Thunderstore version fetch attempt {attempt} failed: {ex}")
              except Exception as ex:
                  last_error = ex
                  print(f"Thunderstore version fetch attempt {attempt} failed: {ex}")

          toml = pathlib.Path("thunderstore.toml")
          current = re.search(r'(?m)^versionNumber = "(.*)"$', toml.read_text()).group(1)
          version = current

          if latest is None:
              # Repo version is authoritative when the API is blocked; do not invent increments.
              print(
                  f"WARNING: could not read Thunderstore latest ({last_error}); "
                  f"publishing committed version {current} as-is."
              )
          else:
              while parse(version) <= parse(latest):
                  version = inc(version)

          text, n = re.subn(r'(?m)^versionNumber = ".*"$', f'versionNumber = "{version}"', toml.read_text(), count=1)
          if n != 1:
              raise SystemExit("Failed to update thunderstore.toml")
          toml.write_text(text)

          manifest = pathlib.Path("manifest.json")
          if manifest.exists():
              text, n = re.subn(r'"version_number"\s*:\s*"[^"]+"', f'"version_number": "{version}"', manifest.read_text(), count=1)
              if n != 1:
                  raise SystemExit("Failed to update manifest.json")
              manifest.write_text(text)
          print(f"Publishing version {version} (repo {current}, thunderstore {latest})")
          PY

      - name: Install tcli
        run: dotnet tool install -g tcli

      - name: Publish
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_API_KEY }}
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "THUNDERSTORE_API_KEY secret is empty"
            exit 1
          fi
          tcli publish --config-path thunderstore.toml --token "$TCLI_AUTH_TOKEN"
